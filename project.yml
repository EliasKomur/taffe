name: Taffe
options:
  bundleIdPrefix: com.eliaskomur
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  Taffe:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - target: TaffeWidget
    entitlements:
      path: Taffe.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.eliaskomur.taffe
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Taffe
        NSMicrophoneUsageDescription: "Taffe écoute le micro pour détecter automatiquement tes taffes."
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ALTAppGroups:
          - group.com.eliaskomur.taffe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eliaskomur.taffe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TaffeWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    entitlements:
      path: TaffeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.eliaskomur.taffe
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: Taffe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ALTAppGroups:
          - group.com.eliaskomur.taffe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eliaskomur.taffe.widget
        SKIP_INSTALL: "YES"
