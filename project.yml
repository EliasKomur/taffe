name: Taffe
options:
  bundleIdPrefix: com.eliaskomur
  deploymentTarget:
    iOS: "17.0"
targets:
  Taffe:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Taffe
        NSMicrophoneUsageDescription: "Taffe écoute le micro pour détecter automatiquement tes taffes."
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eliaskomur.taffe
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
